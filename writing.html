---
layout: default
title: Writing
permalink: /writing/
---

<header class="masthead">
  <h1>Writing</h1>
  <p class="intro">Experiments, notes, and things I've broken and figured out.</p>
</header>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="post-date">{{ post.date | date: "%B %-d, %Y" }}</span>
  </li>
  {% endfor %}
</ul>
