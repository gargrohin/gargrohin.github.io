<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <nav>
      <a href="{{ '/' | relative_url }}" class="nav-title">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/writing/' | relative_url }}">Writing</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
    </nav>

    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <script>
      // Open external links (different host) in a new tab.
      document.querySelectorAll('a[href]').forEach(function (a) {
        if (a.host && a.host !== location.host) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
      });
    </script>
  </body>
</html>
