<footer>
  <ul class="social">
    <li><a href="https://github.com/gargrohin">GitHub</a></li>
    {% if site.email %}<li><a href="mailto:{{ site.email }}">Email</a></li>{% endif %}
    {% if site.linkedin %}<li><a href="{{ site.linkedin }}">LinkedIn</a></li>{% endif %}
    {% if site.twitter %}<li><a href="https://x.com/{{ site.twitter }}">X</a></li>{% endif %}
    {% if site.scholar %}<li><a href="{{ site.scholar }}">Scholar</a></li>{% endif %}
  </ul>
  <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
</footer>
